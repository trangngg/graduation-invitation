<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- Responsive cho điện thoại -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Thiệp Mời</title>

    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            /* Không cho xuất hiện thanh cuộn */
            overflow: hidden;

            /* Căn thiệp chính giữa */
            display: flex;
            justify-content: center;
            align-items: center;

            /* Nền phía sau */
            background: #f5f5f5;

            /* Không cho trình duyệt tự zoom */
            -webkit-text-size-adjust: 100%;
        }

        /* Khung chứa thiệp */
        .invitation {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            /* Hiệu ứng xuất hiện */
            opacity: 0;
            transform: translateY(50px) scale(0.97);

            animation: showCard 1.4s ease-out forwards;
        }

        /* Ảnh thiệp */
        .invitation img {
            display: block;

            /*
             * QUAN TRỌNG:
             * Giới hạn cả chiều rộng và chiều cao.
             * Thiệp luôn nằm gọn trong màn hình.
             */
            width: auto;
            height: auto;

            max-width: 100vw;
            max-height: 100vh;

            /*
             * Không bị méo ảnh
             */
            object-fit: contain;

            /* Bóng nhẹ */
            filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.15));
        }

        /* Hiệu ứng nổi lên */
        @keyframes showCard {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }


        /* =========================
           ĐIỆN THOẠI
           ========================= */

        @media (max-width: 600px) {

            body {
                background: #ffffff;
            }

            .invitation {
                width: 100vw;
                height: 100dvh;
            }

            .invitation img {
                max-width: 100vw;
                max-height: 100dvh;

                width: auto;
                height: auto;
            }
        }


        /* =========================
           LAPTOP / DESKTOP*/

        @media (min-width: 601px) {

            .invitation {
                width: 100vw;
                height: 100dvh;
            }

            .invitation img {
                max-width: 100vw;
                max-height: 100dvh;
            }
        }
    </style>
</head>

<body>

    <div class="invitation">
        <img
            src="thiep-moi.jpg"
            alt="Thiệp mời"
        >
    </div>

</body>
</html>
